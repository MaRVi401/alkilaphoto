<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkilaphoto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=DM+Serif+Display:ital@0;1&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        corinthia: ['Corinthia', 'cursive'],
                        dm: ['"DM Serif Display"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="text-gray-900 font-montserrat min-h-screen"
    style="background-image:url('assets/page-bg-canvas.jpg'); background-size: cover; background-attachment: fixed;">
    <div class="max-w-[1400px] w-full mx-auto px-8 md:px-16 lg:px-24 pt-10 pb-6 flex flex-col flex-grow">
        <header class="flex flex-col w-full mb-8">
            <div class="flex flex-col md:flex-row justify-between items-end w-full pb-4">
                <a href="index.html"
                    class="flex-shrink-0 mb-6 md:mb-0 block w-[180px] md:w-[260px] lg:w-[270px] h-[40px] md:h-[60px] lg:h-[70px] overflow-hidden">
                    <img class="w-full h-full object-cover object-center" src="assets/logo.png" alt="Alkilaphoto" />
                </a>
                <nav class="w-full md:w-auto pb-1">
                    <ul
                        class="flex flex-wrap justify-between md:justify-end gap-6 md:gap-12 lg:gap-16 items-center text-lg md:text-[22px] font-bold">
                        <li>
                            <a href="index.html" class="hover:text-gray-600 transition border-b-2 border-black pb-1">
                                Beranda
                            </a>
                        </li>
                        <li>
                            <a href="about.html"
                                class="hover:text-gray-600 transition border-b-2 border-transparent hover:border-black pb-1">
                                Tentang
                            </a>
                        </li>
                        <li>
                            <a href="portofolio.html"
                                class="hover:text-gray-600 transition border-b-2 border-transparent hover:border-black pb-1">
                                Portofolio
                            </a>
                        </li>
                        <li>
                            <a href="contact.html"
                                class="hover:text-gray-600 transition border-b-2 border-transparent hover:border-black pb-1">
                                Kontak
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="w-full border-b-[2px] border-black mb-8"></div>
        </header>
    </div>
    <main class="relative w-full flex-grow flex flex-col overflow-hidden bg-gray-900 shadow-xl">
        <img class="w-full h-[60vh] md:h-[70vh] object-cover opacity-95" src="assets/8.png" alt="Wedding Photography">
        <div
            class="absolute right-6 bottom-16 md:right-12 md:bottom-20 lg:right-20 lg:bottom-24 text-white text-right drop-shadow-xl">
            <h1 class="font-dm text-4xl md:text-5xl lg:text-[56px] font-normal leading-tight">
                Abadikan
                <span
                    class="font-corinthia italic text-6xl md:text-7xl lg:text-[100px] align-middle px-2">Hangatnya</span><br>
                Momen, Selamanya
            </h1>
            <p
                class="tracking-[0.25em] md:tracking-[0.3em] mt-3 md:mt-5 font-montserrat text-xs md:text-sm font-semibold uppercase">
                Wedding Photography
            </p>
        </div>
    </main>
    <footer class="w-full pt-8 flex justify-center mt-auto">
        <p class="text-gray-800 text-xs md:text-sm font-montserrat font-medium">
            © 2026 Alkilaphoto
        </p>
    </footer>
</body>

</html>
